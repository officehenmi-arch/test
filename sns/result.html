<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:"IPAPGothic","IPAGothic",sans-serif;background:#f7efe4;color:#4a3b32;overflow:hidden}
.wrap{position:relative;width:1080px;height:1080px;padding:70px 70px 60px}
.deco{position:absolute;border-radius:50%;background:#efdcc6}
.tag{display:inline-block;background:#c98b6b;color:#fff;font-size:30px;padding:10px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:72px;margin-top:26px;line-height:1.25;letter-spacing:3px}
h1 span{color:#c1704c}
.main{display:flex;gap:40px;margin-top:40px;align-items:center}
.fig{width:340px;flex:none}
.cards{flex:1;display:flex;flex-direction:column;gap:22px}
.card{background:#fff;border-radius:24px;padding:24px 30px;box-shadow:0 6px 18px rgba(120,80,50,.08)}
.card .l{font-size:28px;color:#8a7466}
.card .v{font-size:50px;font-weight:bold;margin-top:6px}
.card .v b{color:#c1704c;font-size:58px}
.arrow{color:#c98b6b;margin:0 10px}
.foot{position:absolute;left:70px;right:70px;top:915px;font-size:24px;color:#8a7466;line-height:1.6}
